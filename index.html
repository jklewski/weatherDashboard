<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
    <title>Weather Dashboard</title>
    <link rel="preconnect" href="https://docs.google.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <header class="top">
        <div>
            <h1>Weather Dashboard</h1>
            <p class="status" id="status" aria-live="polite">Loading data…</p>
        </div>
        <div class="ranges" role="group" aria-label="Time range" id="ranges">
            <button type="button" data-days="1">24 h</button>
            <button type="button" data-days="7">7 d</button>
            <button type="button" data-days="30">30 d</button>
            <button type="button" data-days="90">90 d</button>
        </div>
    </header>

    <main>
        <section class="info" aria-label="Station info">
            <div class="info-item">
                <a class="info-icon" href="https://www.google.com/maps/search/?api=1&amp;query=55.71332960036078,13.213620125470845" target="_blank" rel="noopener" title="Open in Google Maps" aria-label="Open station location in Google Maps">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
                </a>
                <div>
                    <div class="label">Station location</div>
                </div>
            </div>
            <div class="info-item">
                <a class="info-icon" href="https://docs.google.com/spreadsheets/d/17ZaP_LAmInf3U9zOsFkX-KpC1ypWF3ZrvFiRI71pUiY" target="_blank" rel="noopener" title="Open spreadsheet" aria-label="Open the data spreadsheet in Google Sheets">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 5h-6v4h6v2h-6v5h-2v-5H5v-2h6V8H5V5h14v3z"/></svg>
                </a>
                <div>
                    <div class="label">Need more data?</div>
                </div>
            </div>
            <div class="info-item">
                <a class="info-icon" href="mailto:jonas.niklewski@kstr.lth.se" title="Send email" aria-label="Email Jonas Niklewski">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
                </a>
                <div>
                    <div class="label">Questions or raw data?</div>
                </div>
            </div>
        </section>

        <div class="section-head">
            <h2 id="tiles-title">Last 24 hours</h2>
            <span class="section-note" id="tiles-window"></span>
        </div>
        <section class="tiles" id="tiles" aria-labelledby="tiles-title"></section>
        <section class="charts" id="charts" aria-label="Charts"></section>
    </main>

    <footer class="foot">
        15-minute values from a Campbell CR1000X logger. Hover or drag across a chart to read values.
    </footer>
</body>
</html>
